jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:

          - usernamePassword:
              id: github-creds
              scope: GLOBAL
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              description: GitHub credentials

          - string:
              id: hwc-access-key
              scope: GLOBAL
              secret: ${HWC_ACCESS_KEY}
              description: Huawei Cloud Access Key

          - string:
              id: hwc-secret-key
              scope: GLOBAL
              secret: ${HWC_SECRET_KEY}
              description: Huawei Cloud Secret Key

          - usernamePassword:
              id: swr-jenkins
              scope: GLOBAL
              username: ${SWR_USER}
              password: ${SWR_PASSWORD}
              description: SWR Login Jenkins
